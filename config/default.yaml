# Jenkins Plugin Cache Mirror - Default Configuration

storage:
  limit_bytes: 10737418240  # 10GB default storage limit
  path: /var/cache/jenkins-plugins

upstream:
  url: https://updates.jenkins.io
  timeout_seconds: 60

server:
  port: 8080          # Plugin download endpoint
  metrics_port: 9090  # Prometheus metrics endpoint

admin:
  port: 8081          # Admin API endpoint

ttl:
  enabled: false      # No automatic TTL by default (plugins are immutable)
  default_hours: 0    # 0 = infinite cache (unless manually invalidated)

larder:
  rsa:
    key_path: /etc/larder/tls.key          # RSA private key (mounted from Secret)
    cert_path: /etc/larder/tls.crt         # RSA certificate (mounted from Secret)
  update_center:
    base_url: ""          # Auto-detected from container network interface at startup
    ttl_seconds: 3600     # Cache update-center.json for 1 hour
