# TODO (T068): Create Kubernetes service manifest

apiVersion: v1
kind: Service
metadata:
  name: jenkins-mirror
  labels:
    app: jenkins-mirror
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: plugins
  - port: 8081
    targetPort: 8081
    name: admin
  selector:
    app: jenkins-mirror
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins-mirror-metrics
  labels:
    app: jenkins-mirror
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
    name: metrics
  selector:
    app: jenkins-mirror
