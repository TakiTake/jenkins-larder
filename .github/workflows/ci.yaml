name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Download dependencies
      run: go mod download

    - name: Run unit tests
      run: make test-unit

    - name: Run contract tests
      run: make test-contract

    - name: Run integration tests
      run: make test-integration

    - name: Run linter
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Build binary
      run: make build

    - name: Build Docker image
      env:
        IMAGE_TAG: ${{ github.sha }}
      run: docker build -t "jenkins-larder:${IMAGE_TAG}" .

    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: larder
        path: bin/larder
